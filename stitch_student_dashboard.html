<style>
        body {
            background-color: #070708; /* canvas-global */
            color: #e4e1e6; /* on-surface */
            -webkit-font-smoothing: antialiased;
        }
        
        /* Custom scrollbar for deep-space aesthetic */
        ::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        ::-webkit-scrollbar-track {
            background: #070708;
        }
        ::-webkit-scrollbar-thumb {
            background: #232426;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #353438;
        }

        /* Glassmorphism utility */
        .glass-panel {
            background: rgba(16, 17, 18, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        
        /* Inner glow for high-priority cards */
        .inner-glow-top {
            box-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.1);
        }
        
        /* Focus state outer glow */
        .focus-glow:focus-within {
            box-shadow: 0 0 0 2px rgba(94, 107, 255, 0.2);
        }

        /* Progress Ring Animation */
        .progress-ring__circle {
            transition: stroke-dashoffset 0.8s ease-in-out;
            transform: rotate(-90deg);

        }
    </style>

<div>

</div>
</div>
<!-- Wellness Score Ring -->

<circle class="text-surface-container-high stroke-current" cx="32" cy="32" fill="transparent" r="28" stroke-width="4"></circle>
