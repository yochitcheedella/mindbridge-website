<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#1e1e38" />
      <stop offset="100%" stop-color="#0e0e1a" />
    </radialGradient>

    <!-- Main Bridge Gradient -->
    <linearGradient id="bridgeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Soft Cyan Glow Gradient -->
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#14B8A6" stop-opacity="0.7" />
    </linearGradient>

    <!-- Neural Connection Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="deepShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Base Circle Background with Subtle Ring -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" filter="url(#deepShadow)" />
  <circle cx="256" cy="256" r="238" stroke="url(#bridgeGrad)" stroke-width="3" stroke-opacity="0.35" />

  <!-- Background Ambient Inner Glow -->
  <circle cx="256" cy="256" r="140" fill="#6366F1" opacity="0.08" filter="url(#glow)" />

  <!-- MindBridge Neural Arch (The Bridge) -->
  <!-- Outer Harmonious Bridge Arch -->
  <path 
    d="M 120 330 C 120 180, 220 120, 256 120 C 292 120, 392 180, 392 330 C 352 330, 334 260, 256 260 C 178 260, 160 330, 120 330 Z" 
    fill="url(#bridgeGrad)" 
    filter="url(#glow)"
  />

  <!-- Left Mind Node (Empathy) -->
  <circle cx="155" cy="305" r="28" fill="#6366F1" />
  <circle cx="155" cy="305" r="14" fill="#FFFFFF" opacity="0.9" />

  <!-- Right Mind Node (Clarity) -->
  <circle cx="357" cy="305" r="28" fill="#06B6D4" />
  <circle cx="357" cy="305" r="14" fill="#FFFFFF" opacity="0.9" />

  <!-- Central Synaptic Apex Bridge / Lotus of Well-being -->
  <path 
    d="M 256 160 C 240 200, 220 230, 256 295 C 292 230, 272 200, 256 160 Z" 
    fill="url(#cyanGlow)" 
    filter="url(#glow)"
  />

  <!-- Central Core Light Core -->
  <circle cx="256" cy="245" r="12" fill="#FFFFFF" />

  <!-- Synchronizing Orbit Wave -->
  <path 
    d="M 155 305 Q 256 220 357 305" 
    stroke="#FFFFFF" 
    stroke-width="5" 
    stroke-linecap="round" 
    stroke-dasharray="1 12" 
    opacity="0.8" 
  />

  <!-- Radiance Sparkle Dots -->
  <circle cx="256" cy="115" r="5" fill="#38BDF8" opacity="0.9" />
  <circle cx="190" cy="170" r="4" fill="#818CF8" opacity="0.7" />
  <circle cx="322" cy="170" r="4" fill="#2DD4BF" opacity="0.7" />
</svg>
