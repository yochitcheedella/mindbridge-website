version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://mindbridge:mindbridge_secret@db:5432/mindbridgedb
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - SECRET_KEY=${SECRET_KEY:-mindbridge-vit-secret-production-key-2026}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=10080
    volumes:
      - ./uploads:/app/uploads
      - ./mindbridge.db:/app/mindbridge.db # Kept for sqlite fallback if needed
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 20s
      timeout: 5s
      retries: 3
  
  db:
    image: postgres:15
    environment:
      - POSTGRES_USER=mindbridge
      - POSTGRES_PASSWORD=mindbridge_secret
      - POSTGRES_DB=mindbridgedb
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mindbridge -d mindbridgedb"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres-data:
